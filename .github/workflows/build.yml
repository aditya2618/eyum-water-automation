name: Build Firmware

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install PlatformIO Core
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Build ESP32 Controller Firmware
        run: pio run -e esp32_controller

      - name: Build ESP-01 Relay Firmware
        run: pio run -e esp01_relay

      - name: Build ESP32-C3 Super Mini Firmware
        run: pio run -e esp32c3mini
