; iYum Water Automation firmware project.
; Install PlatformIO Core, then run the commands documented in README.md.

[platformio]
src_dir = src

; Classic ESP32 DevKit V1 (38-pin) - Uses GPIO 18 (Trig), 19 (Echo), 23 (Setup)
[env:esp32]
platform = espressif32
board = esp32dev
board_build.mcu = esp32
board_build.partitions = min_spiffs.csv
framework = arduino
monitor_speed = 115200
upload_speed = 460800
extra_scripts = pre:tools/patch_ino.py
build_src_filter = -<*> +<esp32/>
lib_deps =
    bblanchon/ArduinoJson@^7.0.4
    Links2004/WebSockets@^2.4.1

; Backward-compatible alias for esp32
[env:esp32_controller]
platform = espressif32
board = esp32dev
board_build.mcu = esp32
board_build.partitions = min_spiffs.csv
framework = arduino
monitor_speed = 115200
upload_speed = 460800
extra_scripts = pre:tools/patch_ino.py
build_src_filter = -<*> +<esp32/>
lib_deps =
    bblanchon/ArduinoJson@^7.0.4
    Links2004/WebSockets@^2.4.1

; ESP32-C3 Super Mini - Uses GPIO 0 (Trig), 1 (Echo), 9 (BOOT button)
[env:esp32c3mini]
platform = espressif32
board = esp32-c3-devkitm-1
board_build.mcu = esp32c3
framework = arduino
monitor_speed = 115200
upload_speed = 460800
extra_scripts = pre:tools/patch_ino.py
build_src_filter = -<*> +<esp32c3mini/>
build_flags = 
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

; ESP-01 Relay Node
[env:esp01_relay]
platform = espressif8266
board = esp01_1m
framework = arduino
monitor_speed = 115200
upload_speed = 115200
extra_scripts = pre:tools/patch_ino.py
build_src_filter = -<*> +<relay_node/>
