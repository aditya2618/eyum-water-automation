; Eyum Water Automation firmware project.
; Install PlatformIO Core, then run the commands documented in README.md.

[platformio]
src_dir = src

[env:esp32_controller]
platform = espressif32
board = esp32dev
board_build.mcu = esp32
framework = arduino
monitor_speed = 115200
upload_speed = 460800
extra_scripts = pre:tools/patch_ino.py
build_src_filter = +<tank_controller/>

[env:esp01_relay]
platform = espressif8266
board = esp01_1m
framework = arduino
monitor_speed = 115200
upload_speed = 115200
extra_scripts = pre:tools/patch_ino.py
build_src_filter = +<relay_node/>

